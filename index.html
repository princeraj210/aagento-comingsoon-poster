<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

  <title>Agento — Building in Silence. Launching Louder.</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue-dark: #1a3a8f;
      --blue-mid: #2563eb;
      --blue-light: #38bdf8;
      --teal: #2dd4bf;
      --green-teal: #14b8a6;
      --bg: #eef2fb;
      --bg-card: rgba(255, 255, 255, 0.72);
      --text-dark: #1e293b;
      --text-mid: #475569;
      --text-light: #94a3b8;
      --border: rgba(148, 163, 184, 0.25);
      --shadow: 0 8px 32px rgba(37, 99, 235, 0.10);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Background canvas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Decorative dots & lines overlay ── */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 30%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 88% 70%, rgba(20, 184, 166, 0.07) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── System Status Badge ── */
    .status-badge {
      position: fixed;
      top: clamp(10px, 2.5vw, 20px);
      right: clamp(10px, 3.5vw, 28px);
      z-index: 100;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(7px, 1.8vw, 10px) clamp(12px, 2.5vw, 18px) clamp(7px, 1.8vw, 10px) clamp(10px, 2vw, 14px);
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      animation: fadeSlideDown 0.8s ease 0.2s both;
      max-width: calc(100vw - 20px);
    }

    .status-dot {
      width: clamp(24px, 5vw, 28px);
      height: clamp(24px, 5vw, 28px);
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      flex-shrink: 0;
    }

    .status-dot-inner {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue-mid);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .status-label {
      font-size: clamp(7px, 1.5vw, 9px);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .status-desc {
      font-size: clamp(10px, 2vw, 12px);
      font-weight: 500;
      color: var(--text-mid);
      animation: textGlow 2s ease-in-out infinite;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
      animation: fadeSlideUp 0.9s ease 0.3s both;
      width: 100%;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .logo-image {
      width: auto;
      height: clamp(100px, 25vw, 200px);
      max-width: 90%;
      object-fit: contain;
    }

    .logo-wordmark {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(52px, 10vw, 90px);
      font-weight: 700;
      background: linear-gradient(135deg, #1a3a8f 0%, #2563eb 40%, #14b8a6 80%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* ── Taglines ── */
    .tagline-dark {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--text-dark);
      margin-bottom: 6px;
      line-height: 1.3;
      animation: fadeSlideUp 0.9s ease 0.45s both;
    }

    .tagline-blue {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 600;
      letter-spacing: -0.005em;
      background: linear-gradient(90deg, #14b8a6, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
      line-height: 1.3;
      animation: fadeSlideUp 0.9s ease 0.5s both;
    }

    .subtext {
      font-size: clamp(14px, 2vw, 16px);
      color: var(--text-mid);
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 36px;
      animation: fadeSlideUp 0.9s ease 0.55s both;
    }

    /* ── Headline Wrap ── */
    .headline-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
      margin-bottom: 24px;
    }

    .h-dark {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(18px, 3vw, 23px);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text-dark);
      line-height: 1.4;
      animation: fadeSlideUp 0.9s ease 0.45s both;
    }

    .h-green {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 700;
      letter-spacing: 0.18em;
      background: linear-gradient(135deg, #306BCA 0%, #2F70B9 30%, #2D7C8F 70%, #28a84a 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.4;
      animation: fadeSlideUp 0.9s ease 0.5s both;
    }

    /* ── Countdown ── */
    .countdown-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      gap: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      margin-bottom: 32px;
      animation: fadeSlideUp 0.9s ease 0.6s both;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .cd-number {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .cd-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .cd-sep {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 300;
      color: var(--text-light);
      margin: 0 6px;
      padding-bottom: 18px;
      line-height: 1;
      align-self: flex-start;
      padding-top: 4px;
    }

    /* ── Email CTA ── */
    .cta-wrap {
      width: 100%;
      max-width: 560px;
      margin-bottom: 8px;
      animation: fadeSlideUp 0.9s ease 0.7s both;
    }

    .cta-inner {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      border-radius: 20px;
      padding: 8px 8px 8px 8px;
      gap: 10px;
      box-shadow: 0 4px 24px rgba(37, 99, 235, 0.10);
    }

    .cta-field {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      border-radius: 13px;
      padding: 10px 16px;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.08);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cta-field:focus-within {
      border-color: rgba(37, 99, 235, 0.4);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.14);
    }

    .cta-icon {
      color: var(--text-light);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .cta-input {
      flex: 1;
      border: none;
      outline: none !important;
      box-shadow: none !important;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: transparent;
      min-width: 0;
      caret-color: #2563eb;
    }

    .cta-input:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    .cta-input::placeholder {
      color: var(--text-light);
    }

    .cta-btn {
      background: linear-gradient(135deg, #306BCA 0%, #2F70B9 30%, #2D7C8F 70%, #28a84a 90%);
      color: white;
      border: none;
      border-radius: 17px;
      padding: 13px 28px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: box-shadow 0.22s, transform 0.18s, opacity 0.18s;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }

    .cta-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45, 124, 143, 0.38);
    }

    .cta-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .cta-note {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 0;
      animation: fadeSlideUp 0.9s ease 0.75s both;
    }

    .cta-note span {
      background: black;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 500;
    }

    /* ── Feature Cards ── */
    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 900px;
      padding: 0 24px;
      margin-bottom: 60px;
      animation: fadeSlideUp 0.9s ease 0.85s both;
    }

    .feat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.06);
      backdrop-filter: blur(12px);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .feat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.13);
    }

    .feat-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
    }

    .feat-icon svg {
      width: 28px;
      height: 28px;
      stroke-width: 1.5;
    }

    .feat-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #2563eb;
    }

    .feat-desc {
      font-size: 12px;
      color: var(--text-mid);
      font-weight: 400;
      line-height: 1.5;
    }

    /* ── Footer strip ── */
    .footer-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 20px;
      animation: fadeSlideUp 0.9s ease 0.95s both;
    }

    .footer-star {
      color: #2563eb;
      font-size: 20px;
      animation: spin 8s linear infinite;
    }

    .footer-text {
      font-family: 'Space Mono', monospace;
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.28em;
      color: var(--text-light);
      text-transform: uppercase;
    }

    /* ── Animations ── */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.6;
      }
    }

    @keyframes textGlow {

      0%,
      100% {
        text-shadow: 0 0 5px rgba(37, 99, 235, 0), 0 0 10px rgba(37, 99, 235, 0);
      }

      50% {
        text-shadow: 0 0 10px rgba(37, 99, 235, 0.8), 0 0 20px rgba(37, 99, 235, 0.5);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #2563eb, #14b8a6);
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.35);
      transition: transform 0.4s cubic-bezier(.34, 1.56, .64, 1);
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .status-desc {
        display: none;
      }

      .hero {
        padding: 80px 20px 40px;
      }

      .logo-wrap {
        gap: 10px;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
      }

      .countdown-wrap {
        padding: 18px 16px;
        gap: 0;
      }

      .cd-unit {
        min-width: 52px;
      }

      .cd-sep {
        margin: 0 3px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .cta-btn {
        padding: 12px 16px;
        font-size: 13px;
      }
    }

    @media (max-width: 420px) {
      .countdown-wrap {
        padding: 14px 10px;
      }

      .cd-unit {
        min-width: 44px;
      }

      .features {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .feat-card {
        padding: 16px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Particle canvas -->
  <canvas id="bg-canvas"></canvas>
  <div class="bg-overlay"></div>

  <!-- System Status -->
  <div class="status-badge">
    <div class="status-dot">
      <div class="status-dot-inner"></div>
    </div>
    <div class="status-text">
      <!-- <span class="status-label">System Status</span> -->
      <span class="status-desc">stealth mode</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">🎉 You're on the list!</div>

  <main class="page">
    <section class="hero">

      <!-- Logo -->
      <div class="logo-wrap">
        <img src="assets/NEW LOGO FINAL.png" alt="Agento Logo" class="logo-image" />
      </div>

      <div class="headline-wrap">
        <span class="h-dark">WE'D LOVE TO TELL YOU WHAT WE'RE BUILDING.</span>
        <span class="h-green">BUT OUR MARKETING HEAD SAID NO.</span>
      </div>

      <!-- Countdown
    <div class="countdown-wrap">
      <div class="cd-unit">
        <span class="cd-number" id="cd-days">23</span>
        <span class="cd-label">Days</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-number" id="cd-hours">17</span>
        <span class="cd-label">Hours</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-number" id="cd-mins">42</span>
        <span class="cd-label">Minutes</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-number" id="cd-secs">09</span>
        <span class="cd-label">Seconds</span>
      </div>
    </div> -->

      <!-- Email CTA -->
      <div class="cta-wrap">
        <div class="cta-inner">

          <div class="cta-field">
            <span class="cta-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="M2 7l10 7 10-7" />
              </svg>
            </span>

            <input class="cta-input" id="email-input" type="email" placeholder="Enter your email for early access"
              autocomplete="email" required />
          </div>

          <button class="cta-btn" type="button" onclick="handleCTA()">
            Reserve My Spot

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>

        </div>
      </div>
      <p class="cta-note">
        <span>No spam. We hate that too.</span>
      </p>
    </section>
  </main>


  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>

    /* ─────────────────────────────────────────────
       EMAILJS INIT
    ───────────────────────────────────────────── */

    emailjs.init({
      publicKey: "AD_36oQH7ZCOA0fgl",
    });


    /* ─────────────────────────────────────────────
       COUNTDOWN TIMER
    ───────────────────────────────────────────── */

    const launchDate = new Date();

    launchDate.setDate(launchDate.getDate() + 23);
    launchDate.setHours(launchDate.getHours() + 17);
    launchDate.setMinutes(launchDate.getMinutes() + 42);
    launchDate.setSeconds(launchDate.getSeconds() + 9);

    function pad(n) {
      return String(Math.max(0, n)).padStart(2, '0');
    }

    function tick() {

      const diff = launchDate - Date.now();

      if (diff <= 0) return;

      const dayEl = document.getElementById('cd-days');
      const hourEl = document.getElementById('cd-hours');
      const minEl = document.getElementById('cd-mins');
      const secEl = document.getElementById('cd-secs');

      if (!dayEl || !hourEl || !minEl || !secEl) return;

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);

      dayEl.textContent = pad(days);
      hourEl.textContent = pad(hours);
      minEl.textContent = pad(mins);
      secEl.textContent = pad(secs);
    }

    tick();

    setInterval(tick, 1000);


    /* ─────────────────────────────────────────────
       GET USER GEOLOCATION DATA
    ───────────────────────────────────────────── */

    async function getUserGeoData() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        
        return {
          ip_address: data.ip || 'N/A',
          city: data.city || 'N/A',
          region: data.region || 'N/A',
          country: data.country_name || 'N/A',
          timezone: data.timezone || 'N/A',
          latitude: data.latitude || 'N/A',
          longitude: data.longitude || 'N/A',
        };
      } catch (error) {
        console.error('Geolocation Error:', error);
        return {
          ip_address: 'N/A',
          city: 'N/A',
          region: 'N/A',
          country: 'N/A',
          timezone: 'N/A',
          latitude: 'N/A',
          longitude: 'N/A',
        };
      }
    }

    /* ─────────────────────────────────────────────
       WAITLIST SUBMIT
    ───────────────────────────────────────────── */

    async function handleCTA() {

      const input = document.getElementById('email-input');
      const email = input.value.trim();

      const button = document.querySelector('.cta-btn');

      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Validate email
      if (!re.test(email)) {

        input.style.outline = '2px solid #ef4444';

        setTimeout(() => {
          input.style.outline = '';
        }, 1200);

        return;
      }

      try {

        // Button loading state
        button.disabled = true;

        button.innerHTML = `
        Sending...
      `;

        // Get geolocation data
        const geoData = await getUserGeoData();

        // Get current time
        const now = new Date();
        const time = now.toLocaleString();

        // Send Email with all user data
        await emailjs.send(
          'service_9d14hky',
          'template_g32z7li',
          {
            user_email: email,
            ip_address: geoData.ip_address,
            city: geoData.city,
            region: geoData.region,
            country: geoData.country,
            timezone: geoData.timezone,
            latitude: geoData.latitude,
            longitude: geoData.longitude,
            time: time,
            submitted_at: time,
          }
        );

        // Success toast
        const toast = document.getElementById('toast');

        toast.innerHTML = '🎉 You are on the waitlist!';

        toast.classList.add('show');

        // Reset input
        input.value = '';

        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);

      } catch (error) {

        console.error('EmailJS Error:', error);

        alert('Something went wrong. Please try again.');

      } finally {

        // Restore button
        button.disabled = false;

        button.innerHTML = `
        Reserve My Spot
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      `;
      }
    }


    /* ─────────────────────────────────────────────
       ENTER KEY SUPPORT
    ───────────────────────────────────────────── */

    document
      .getElementById('email-input')
      .addEventListener('keydown', e => {

        if (e.key === 'Enter') {
          handleCTA();
        }

      });


    /* ─────────────────────────────────────────────
       PARTICLE BACKGROUND
    ───────────────────────────────────────────── */

    (function () {

      const canvas = document.getElementById('bg-canvas');

      const ctx = canvas.getContext('2d');

      let W, H, particles = [];

      function resize() {

        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;

      }

      resize();

      window.addEventListener('resize', resize);

      const NODE_COUNT = Math.min(
        60,
        Math.floor(window.innerWidth / 22)
      );

      const COLORS = [
        '#2563eb',
        '#38bdf8',
        '#14b8a6',
        '#6d28d9'
      ];

      const CONNECT_DIST = 160;

      for (let i = 0; i < NODE_COUNT; i++) {

        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 2.2 + 1,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          alpha: Math.random() * 0.5 + 0.15,
        });

      }

      function draw() {

        ctx.clearRect(0, 0, W, H);

        // Draw connections
        for (let i = 0; i < particles.length; i++) {

          for (let j = i + 1; j < particles.length; j++) {

            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < CONNECT_DIST) {

              const alpha = (1 - dist / CONNECT_DIST) * 0.18;

              ctx.beginPath();

              ctx.strokeStyle = `rgba(37,99,235,${alpha})`;

              ctx.lineWidth = 0.8;

              ctx.moveTo(
                particles[i].x,
                particles[i].y
              );

              ctx.lineTo(
                particles[j].x,
                particles[j].y
              );

              ctx.stroke();
            }
          }
        }

        // Draw particles
        for (const p of particles) {

          ctx.beginPath();

          ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            p.color +
            Math.round(p.alpha * 255)
              .toString(16)
              .padStart(2, '0');

          ctx.fill();

          // Update movement
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > W) p.vx *= -1;

          if (p.y < 0 || p.y > H) p.vy *= -1;
        }

        requestAnimationFrame(draw);
      }

      draw();

    })();

  </script>
</body>
